<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gtBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0362C3"/>
      <stop offset="100%" stop-color="#024DA1"/>
    </linearGradient>
    <linearGradient id="gtCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0362C3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem: Geometric Futuristic 'G' with Forward Tech Chevron -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex Shield Segment -->
    <path d="M 45 10 L 80 30 L 80 70 L 45 90 L 10 70 L 10 30 Z" 
          fill="none" 
          stroke="url(#gtBlueGrad)" 
          stroke-width="7" 
          stroke-linejoin="round"/>
    
    <!-- Inner G Spiral & Forward Arrow -->
    <path d="M 62 38 L 45 28 L 28 38 L 28 62 L 45 72 L 62 62 L 62 50 L 42 50" 
          fill="none" 
          stroke="#43464A" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 48 50 L 68 50 L 58 40 M 68 50 L 58 60" 
          fill="none" 
          stroke="url(#gtCyanGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Tech Nodes -->
    <circle cx="80" cy="30" r="5" fill="#0362C3"/>
    <circle cx="45" cy="90" r="5" fill="#43464A"/>
    <circle cx="10" cy="30" r="5" fill="#38BDF8"/>
  </g>

  <!-- Company Name Typography -->
  <text x="110" y="62" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="40" letter-spacing="-0.5" fill="#43464A">
    GRAYTUS
  </text>
  <text x="112" y="88" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="16" letter-spacing="4.5" fill="#0362C3">
    TECHNOLOGIES
  </text>
</svg>
